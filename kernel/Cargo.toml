[package]
name = "lemos-kernel"
version = "0.1.0"
edition = "2024"
description = "Der Kernel von lemOS"
license = "GPL-3.0-or-later"

[[bin]]
name = "lemos-kernel"
test = false
bench = false

[dependencies]
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
limine = "0.6.5"
linked_list_allocator = "0.10.5"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "lazy"] }
x86_64 = "0.15.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
